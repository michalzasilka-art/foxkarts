<!doctype html>
<!-- A build tool, not part of the game: loads each official character (tools/src/*.glb), poses it at the end of its
     "sit" clip, bakes the skinned mesh to a plain mesh with a smaller texture, and sends the result (chars/<name>.glb)
     plus a few measurements to the local receiver on port 8199. Open it in the browser pane. -->
<meta charset="utf-8"><title>bake seated characters</title>
<script type="importmap">{ "imports": { "three": "../lib/three.module.min.js" } }</script>
<body style="background:#223;color:#fff;font:14px monospace"><pre id="log">starting…</pre>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '../lib/GLTFLoader.js';
import { GLTFExporter } from 'https://unpkg.com/three@0.170.0/examples/jsm/exporters/GLTFExporter.js';
const log = (t) => { document.getElementById('log').textContent += '\n' + t; console.log(t); };
const post = (name, body) => fetch('http://127.0.0.1:8199/?name=' + name, { method: 'POST', body }).then((r) => r.text());
window.RESULT = {};
async function bake(name, texSize) {
  const gltf = await new GLTFLoader().loadAsync(`src/${name}.glb`);
  const root = gltf.scene, mixer = new THREE.AnimationMixer(root);
  const clip = gltf.animations.find((a) => a.name === 'sit'); const act = mixer.clipAction(clip); act.play();
  for (const extra of ['tail_sit', 'face_happy']) { const c = gltf.animations.find((a) => a.name === extra); if (c) { const a2 = mixer.clipAction(c); a2.play(); } }
  mixer.setTime(clip.duration - .04);   // the end of "sit" = sitting still
  root.updateMatrixWorld(true);
  // --- driving pose: lean forward a little and put the hands on the steering wheel ---
  // (the kart's wheel centre is at (0, .666, .103) in kart space, tilted 45°; the hips go to SEAT; the game scales the
  //  character by FIT[name]; so the wheel's rim points, in this model's own space, are:)
  const FIT = { foxino: 1.55, stella: 1.55, pix: 1.35, rob: 1.15 }, S = FIT[name] || 1.4, SEAT = [0, .376, -.361];   // (measured in the game, v66: the hips sit here in kart space)
  const WHEEL = { L: [.18, .72, .16], R: [-.18, .72, .16] };   // 10 and 2 o'clock on the rim of the Meshy wheel (centre (0,.631,.102), r .212, tilted 34°; measured in the game, v66)
  const bn = (n) => root.getObjectByName(n), wp = (b) => b.getWorldPosition(new THREE.Vector3());
  const hips = wp(bn('Hips')), toModel = (w) => new THREE.Vector3((w[0] - SEAT[0]) / S + hips.x, (w[1] - SEAT[1]) / S + hips.y, (w[2] - SEAT[2]) / S + hips.z);
  const rotWorld = (b, axis, ang) => { const q = new THREE.Quaternion().setFromAxisAngle(axis, ang), pw = b.parent.getWorldQuaternion(new THREE.Quaternion()), bw = b.getWorldQuaternion(new THREE.Quaternion()); bw.premultiply(q); b.quaternion.copy(pw.invert().multiply(bw)); b.updateMatrixWorld(true); };
  const X = new THREE.Vector3(1, 0, 0);
  for (const sp of ['Spine02', 'Spine01']) if (bn(sp)) rotWorld(bn(sp), X, .3);   // lean forward (facing +Z: +X turns the top towards +Z)
  const reach = (side, target) => {
    const A = bn(side + 'Arm'), F = bn(side + 'ForeArm'), H = bn(side + 'Hand'); if (!A || !F || !H) return;
    rotWorld(A, X, 1.2);   // first swing the whole arm forward, so the elbow bends the natural way
    for (let it = 0; it < 60; it++) for (const b of [F, A]) {   // then CCD: the forearm, then the upper arm, towards the target
      const bp = wp(b), ep = wp(H), v1 = ep.sub(bp).normalize(), v2 = target.clone().sub(bp).normalize();
      const q = new THREE.Quaternion().setFromUnitVectors(v1, v2), pw = b.parent.getWorldQuaternion(new THREE.Quaternion()), bw = b.getWorldQuaternion(new THREE.Quaternion());
      bw.premultiply(q); b.quaternion.copy(pw.invert().multiply(bw)); b.updateMatrixWorld(true);
    }
  };
  reach('Left', toModel(WHEEL.L)); reach('Right', toModel(WHEEL.R));
  // v68 (the user: "turn the hands 180° so they are on the wheel"): the palms faced away from the rim — spin each hand half a turn about its own forearm
  for (const side of ['Left', 'Right']) { const H = bn(side + 'Hand'), F = bn(side + 'ForeArm'); if (!H || !F) continue; const ax = wp(H).sub(wp(F)).normalize(); rotWorld(H, ax, Math.PI); }
  root.updateMatrixWorld(true);
  const handGap = { L: wp(bn('LeftHand')).distanceTo(toModel(WHEEL.L)), R: wp(bn('RightHand')).distanceTo(toModel(WHEEL.R)) };
  let sk = null; root.traverse((o) => { if (o.isSkinnedMesh) sk = o; });
  const src = sk.geometry, n = src.attributes.position.count, pos = new Float32Array(n * 3), v = new THREE.Vector3();
  for (let i = 0; i < n; i++) { v.fromBufferAttribute(src.attributes.position, i); sk.applyBoneTransform(i, v); v.applyMatrix4(sk.matrixWorld); pos[i * 3] = v.x; pos[i * 3 + 1] = v.y; pos[i * 3 + 2] = v.z; }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('uv', src.attributes.uv.clone()); if (src.index) { /* (v86) the head goes: every triangle with a corner weighted to the head bones (Head and everything under it) is dropped, so no nose or mouth can poke out between the arms, whatever the lean */ const headSet = new Set(); const H0 = sk.skeleton.bones.find((b) => b.name === 'Head'); if (H0) H0.traverse((b) => { const k = sk.skeleton.bones.indexOf(b); if (k >= 0) headSet.add(k); }); const si = src.attributes.skinIndex, sw = src.attributes.skinWeight, isHead = new Uint8Array(n); for (let v = 0; v < n; v++) { let w = 0; for (let c = 0; c < 4; c++) if (headSet.has(si.getComponent(v, c))) w += sw.getComponent(v, c); isHead[v] = w > .3; } const ix = src.index.array, keep = []; for (let t = 0; t < ix.length; t += 3) if (!isHead[ix[t]] && !isHead[ix[t + 1]] && !isHead[ix[t + 2]]) keep.push(ix[t], ix[t + 1], ix[t + 2]); geo.setIndex(keep); window.RESULT_HEAD = (window.RESULT_HEAD || {}); window.RESULT_HEAD[name] = { dropped: (ix.length - keep.length) / 3, bones: headSet.size }; } geo.computeVertexNormals();
  // the texture, smaller
  const img = sk.material.map.image, cv = document.createElement('canvas'); cv.width = cv.height = texSize; cv.getContext('2d').drawImage(img, 0, 0, texSize, texSize);
  const tex = new THREE.CanvasTexture(cv); tex.flipY = false; tex.colorSpace = THREE.SRGBColorSpace; tex.userData.mimeType = 'image/jpeg';   // (the exporter writes a JPEG: a fifth of the size)
  const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: .8, metalness: 0 });
  const mesh = new THREE.Mesh(geo, mat); mesh.name = name;
  // measurements for the game: where the head is, its size, the body's box
  geo.computeBoundingBox(); const bb = geo.boundingBox;
  const bone = (b) => { const o = root.getObjectByName(b); if (!o) return null; const p = new THREE.Vector3(); o.getWorldPosition(p); return p.toArray().map((x) => +x.toFixed(3)); };
  const headTop = bone('head_end') || bone('Head'), head = bone('Head'), neck = bone('neck');
  // head width: the widest x among vertices in the top part of the head
  let hw = 0, hz0 = 1e9, hz1 = -1e9; if (head) for (let i = 0; i < n; i++) { const y = pos[i * 3 + 1]; if (y > head[1] - .02 && y < head[1] + .25) { hw = Math.max(hw, Math.abs(pos[i * 3] - head[0])); hz0 = Math.min(hz0, pos[i * 3 + 2]); hz1 = Math.max(hz1, pos[i * 3 + 2]); } }
  const info = { name, verts: n, handGap, box: { min: bb.min.toArray().map((x) => +x.toFixed(3)), max: bb.max.toArray().map((x) => +x.toFixed(3)) }, head, headTop, neck, headHalfWidth: +hw.toFixed(3), headZ: [+hz0.toFixed(3), +hz1.toFixed(3)], hands: { L: bone('LeftHand'), R: bone('RightHand') }, hips: bone('Hips'), ears: { L: bone('ear_L1'), R: bone('ear_R1') } };
  window.RESULT[name] = info; log(name + ' ' + JSON.stringify(info));
  const buf = await new Promise((ok, no) => new GLTFExporter().parse(mesh, ok, no, { binary: true }));
  log(name + ' glb ' + buf.byteLength + ' → ' + await post(name + '.glb', buf));
}
try {
  for (const [name, sz] of [['foxino', 1024], ['stella', 1024], ['rob', 1024], ['pix', 1024]]) await bake(name, sz);
  await post('bake-info.json', JSON.stringify(window.RESULT, null, 1)); log('ALL DONE'); window.DONE = true;
} catch (e) { log('ERROR ' + e.message + '\n' + e.stack); window.DONE = 'error'; }
</script>
